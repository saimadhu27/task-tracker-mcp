name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -v

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-tracker-mcp:ci .
      - name: Check the image runs as a non-root user
        run: |
          test "$(docker run --rm task-tracker-mcp:ci id -u)" != "0"
      - name: Check no .env is baked into the image
        run: |
          docker run --rm task-tracker-mcp:ci sh -c 'test ! -e /app/.env'

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked by git. Remove it and rotate any secrets in it."
            exit 1
          fi

  deploy:
    name: deploy
    needs: [test, docker, hygiene]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      ECR_REPOSITORY: task-tracker-mcp
      ECS_CLUSTER: default
      ECS_SERVICE: task-tracker
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, ref, repository}'
      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push the image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run database migrations (one-off task with the new image)
        run: RUN_IMAGE="$IMAGE" bash scripts/ecs-run.sh alembic upgrade head

      - name: Update the service
        run: |
          SERVICE_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceArn' --output text)
          bash scripts/render-container.sh > /tmp/primary.json
          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" \
            --primary-container file:///tmp/primary.json

      - name: Wait for the rollout, then check the new image is live
        run: |
          sleep 30
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          TD=$(aws ecs describe-express-gateway-service \
            --service-arn "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].serviceArn' --output text)" \
            --query 'service.activeConfigurations[0].taskDefinitionArn' --output text)
          live=$(aws ecs describe-task-definition --task-definition "$TD" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          if [ "$live" != "$IMAGE" ]; then
            echo "The service is running $live, not $IMAGE. The deployment may have rolled back." >&2
            exit 1
          fi

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-connrefused "$PUBLIC_BASE_URL/health"
          curl -fsS --retry 10 --retry-delay 6 --retry-connrefused "$PUBLIC_BASE_URL/ready"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_BASE_URL/mcp" \
            -H 'content-type: application/json' -d '{}')
          test "$code" = "401"